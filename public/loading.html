<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inaunganisha Mfumo... | Powered by MOHAMEDYTECH PRO</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#030712">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Animated Ambient Background Glow */
        .ambient-glow {
            position: absolute;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.35) 0%, rgba(59, 130, 246, 0.35) 50%, rgba(16, 185, 129, 0.2) 100%);
            filter: blur(80px);
            border-radius: 50%;
            animation: pulse-glow 6s ease-in-out infinite alternate;
            z-index: 1;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.8) rotate(0deg); opacity: 0.6; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 0.9; }
            100% { transform: scale(0.9) rotate(360deg); opacity: 0.7; }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 500px;
            width: 100%;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(59, 130, 246, 0.2);
        }

        /* Logo / University Badge */
        .badge-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 20px;
            background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* Rainbow sliding title */
        .powered-by-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            background: linear-gradient(
                90deg,
                #ff007f,
                #ff7b00,
                #ffee00,
                #00f0ff,
                #7b00ff,
                #ff007f
            );
            background-size: 400% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-slide 4s linear infinite;
            text-shadow: 0 0 25px rgba(255, 0, 127, 0.4);
        }

        @keyframes rainbow-slide {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .highlight-text {
            color: #38bdf8;
            font-weight: 600;
        }

        /* Multi-color Animated Progress Bar */
        .progress-wrapper {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%;
            border-radius: 999px;
            background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6, #10b981);
            background-size: 200% 100%;
            animation: indeterminate 2s infinite ease-in-out, rainbow-bar 3s linear infinite;
        }

        @keyframes indeterminate {
            0% { left: -40%; width: 40%; }
            50% { left: 20%; width: 60%; }
            100% { left: 100%; width: 40%; }
        }

        @keyframes rainbow-bar {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 18px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
            animation: blink 1.2s infinite ease-in-out;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .refresh-button {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            padding: 10px 22px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        .refresh-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .footer-note {
            margin-top: 24px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="container">
        <div class="badge-icon" style="overflow: hidden; padding: 3px; background: linear-gradient(135deg, #f59e0b, #ec4899, #3b82f6);">
            <img src="/mohamedtechpro-logo.png" alt="MOHAMEDTECH PRO" style="width: 100%; height: 100%; object-fit: cover; border-radius: 17px;">
        </div>

        <!-- Sliding Rainbow Brand Text -->
        <h1 class="powered-by-title">POWERED BY MOHAMEDYTECH PRO</h1>

        <p class="subtitle">
            CBE E-Logbook & Field Attendance Portal inaamka kutoka sleep mode.<br>
            <span class="highlight-text">Subiri sekunde chache...</span> mfumo unajiandaa kiotomatiki.
        </p>

        <div class="progress-wrapper">
            <div class="progress-bar"></div>
        </div>

        <div class="status-badge">
            <div class="status-dot"></div>
            <span id="countdown-text">Inawasha seva (Auto-connecting...)</span>
        </div>

        <div>
            <button class="refresh-button" onclick="window.location.reload();">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                Fungua Sasa (Reload)
            </button>
        </div>

        <p class="footer-note">
            College of Business Education &bull; Hakimiliki zote zimehifadhiwa &copy; 2026<br>
            Eng. MOHAMEDY HAMADI MOHAMED
        </p>
    </div>

    <script>
        let attempts = 0;
        const maxAttempts = 30;

        function checkServer() {
            attempts++;
            const countdownEl = document.getElementById('countdown-text');
            if (countdownEl) {
                countdownEl.innerText = `Inawasha seva (${attempts * 3}s)... Subiri kidogo`;
            }

            fetch('/api/health-check', { method: 'GET', cache: 'no-store' })
                .then(res => {
                    if (res.ok || res.status === 200 || res.status === 302 || res.status === 401) {
                        window.location.href = '/cbe/login';
                    } else {
                        setTimeout(checkServer, 3000);
                    }
                })
                .catch(() => {
                    if (attempts < maxAttempts) {
                        setTimeout(checkServer, 3000);
                    } else {
                        window.location.reload();
                    }
                });
        }

        setTimeout(checkServer, 2000);
    </script>
</body>
</html>
